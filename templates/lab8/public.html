{% extends "base.html" %}

{% block lab %}Лабораторная работа 8{% endblock %}

{% block main %}
    <h1>Публичные статьи</h1>
    <form method="get" style="margin-bottom: 20px;">
        <label>
            Поиск: 
            <input type="text" name="search" value="{{ search or '' }}">
        </label>
        <button type="submit">Найти</button>
        {% if search %}
            <a href="/lab8/public/">Показать все</a>
        {% endif %}
    </form>

    {% for article in articles %}
        <h2>{{ article['title'] }}</h2>
        <div>
            <p>{{ article['article_text'] }}</p>
        </div>
    {% endfor %}

    <div>
      <a href="/lab8/">Назад</a>  
    </div>
    
{% endblock %}
