{% extends "base.html" %}

{% block lab %}Личный кабинет{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadUserInfo()
        .then(function(user) {
            if (!user) {
                window.location.href = '/rgz/login';
                return;
            }
            
            document.getElementById('user-full-name').textContent = user.full_name;
            document.getElementById('user-login').textContent = user.login;
            document.getElementById('user-phone').textContent = user.phone || '-';
            document.getElementById('user-account').textContent = user.account;
            document.getElementById('user-balance').textContent = user.balance.toFixed(2) + ' руб.';
            document.getElementById('user-status').textContent = user.is_manager ? 'Менеджер' : 'Клиент';
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
        })
        .catch(function(error) {
            console.error('Error loading dashboard:', error);
            if (error.message === 'Unauthorized') {
                window.location.href = '/rgz/login';
            } else {
                document.getElementById('loading').textContent = 'Ошибка загрузки данных';
            }
        });
});
</script>
{% endblock %}

{% block main %}
    <h1>Личный кабинет</h1>
    
    <div id="loading">Загрузка данных...</div>
    
    <div id="user-info" style="display: none; background: #f5f5f5; padding: 15px; margin: 15px 0; border-radius: 5px;">
        <p><strong>ФИО:</strong> <span id="user-full-name"></span></p>
        <p><strong>Логин:</strong> <span id="user-login"></span></p>
        <p><strong>Телефон:</strong> <span id="user-phone"></span></p>
        <p><strong>Счет:</strong> <span id="user-account"></span></p>
        <p><strong>Баланс:</strong> <span id="user-balance"></span></p>
        <p><strong>Статус:</strong> <span id="user-status"></span></p>
    </div>
    
    <div>
        <a href="/rgz/transfer">Перевести деньги</a> |
        <a href="/rgz/transactions">История операций</a> |
        <a href="/rgz">На главную</a>
    </div>
{% endblock %}
