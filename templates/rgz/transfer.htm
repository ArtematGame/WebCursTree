{% extends "base.html" %}

{% block lab %}Перевод денег{% endblock %}

{% block main %}
    <h1>Перевод денег</h1>
    
    <p><strong>Ваш баланс:</strong> {{ user.balance }} руб.</p>
    
    {% if error %}
        <div style="color: red; font-weight: bold; margin-bottom: 10px;">
            {{ error }}
        </div>
    {% endif %}

    <form action="/rgz/transfer" method="post">
        <div>
            <label>
                Куда перевести (номер счета или телефон): <br>
                <input type="text" name="to_account">
            </label>
        </div>

        <div>
            <label>
                Сумма: <br>
                <input type="number" name="amount" step="0.01" min="0.01">
            </label>
        </div>
        
        <div>
            <label>
                Назначение платежа: <br>
                <input type="text" name="description">
            </label>
        </div>

        <div>
            <button type="submit">Выполнить перевод</button>
        </div>
    </form>
    <div>
        <a href="/rgz/dashboard">Вернуться в личный кабинет</a>
    </div>
{% endblock %}
