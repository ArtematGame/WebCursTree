{% extends "base.html" %}

{% block lab %}Перевод денег{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadUserInfo()
        .then(function(user) {
            if (!user) {
                window.location.href = '/rgz/login';
                return;
            }
            
            document.getElementById('user-balance').textContent = user.balance.toFixed(2) + ' руб.';
        })
        .catch(function(error) {
            window.location.href = '/rgz/login';
        });
});

function handleTransfer() {
    const toAccount = document.getElementById('to-account').value;
    const amount = document.getElementById('amount').value;
    const description = document.getElementById('description').value;
    const errorDiv = document.getElementById('error-message');
    
    errorDiv.style.display = 'none';
    
    if (!toAccount || !amount) {
        errorDiv.textContent = 'Заполните все обязательные поля';
        errorDiv.style.display = 'block';
        return;
    }
    
    if (parseFloat(amount) <= 0) {
        errorDiv.textContent = 'Сумма должна быть больше 0';
        errorDiv.style.display = 'block';
        return;
    }
    
    performTransfer(toAccount, amount, description)
        .then(function(result) {
            window.location.href = '/rgz/success?message=' + encodeURIComponent(result.message);
        })
        .catch(function(error) {
            errorDiv.textContent = 'Ошибка перевода: ' + error.message;
            errorDiv.style.display = 'block';
        });
}
</script>
{% endblock %}

{% block main %}
    <h1>Перевод денег</h1>
    
    <p><strong>Ваш баланс:</strong> <span id="user-balance">Загрузка...</span></p>
    
    <div id="error-message" class="error" style="display: none;"></div>

    <form onsubmit="event.preventDefault(); handleTransfer();">
        <div>
            <label>
                Куда перевести (номер счета или телефон): <br>
                <input type="text" id="to-account">
            </label>
        </div>

        <div>
            <label>
                Сумма: <br>
                <input type="number" id="amount" step="0.01" min="0.01">
            </label>
        </div>
        
        <div>
            <label>
                Назначение платежа: <br>
                <input type="text" id="description">
            </label>
        </div>

        <div>
            <button type="submit">Выполнить перевод</button>
        </div>
    </form>
    
    <div>
        <a href="/rgz/dashboard">Вернуться в личный кабинет</a>
    </div>
{% endblock %}
