{% extends "base.html" %}

{% block lab %}Управление пользователями{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Проверяем, является ли пользователь менеджером
    loadUserInfo()
        .then(function(user) {
            if (!user) {
                window.location.href = '/rgz/login';
                return;
            }
            
            if (!user.is_manager) {
                alert('Доступ запрещен. Требуются права менеджера.');
                window.location.href = '/rgz/dashboard';
                return;
            }
            
            // Загружаем всех пользователей
            return loadAllUsers();
        })
        .then(function(users) {
            const usersTable = document.getElementById('users-table');
            const loadingDiv = document.getElementById('loading');
            
            if (!users || users.length === 0) {
                loadingDiv.innerHTML = '<p>Нет пользователей</p>';
                return;
            }
            
            let html = `
                <table border="1" style="width: 100%; border-collapse: collapse;">
                    <tr>
                        <th>ФИО</th>
                        <th>Логин</th>
                        <th>Телефон</th>
                        <th>Счет</th>
                        <th>Баланс</th>
                        <th>Роль</th>
                    </tr>
            `;
            
            users.forEach(function(u) {
                html += `
                    <tr>
                        <td>${u.full_name}</td>
                        <td>${u.login}</td>
                        <td>${u.phone || '-'}</td>
                        <td>${u.account}</td>
                        <td>${u.balance.toFixed(2)} руб.</td>
                        <td>${u.is_manager ? 'Менеджер' : 'Клиент'}</td>
                    </tr>
                `;
            });
            
            html += '</table>';
            usersTable.innerHTML = html;
            loadingDiv.style.display = 'none';
            usersTable.style.display = 'block';
        })
        .catch(function(error) {
            console.error('Error loading users:', error);
            document.getElementById('loading').textContent = 'Ошибка загрузки пользователей';
        });
});
</script>
{% endblock %}

{% block main %}
    <h1>Управление пользователями</h1>
    
    <div id="loading">Загрузка пользователей...</div>
    <div id="users-table" style="display: none;"></div>
    
    <div style="margin-top: 20px;">
        <a href="/rgz/create_user">Создать нового пользователя</a> |
        <a href="/rgz/dashboard">Вернуться в личный кабинет</a>
    </div>
{% endblock %}
